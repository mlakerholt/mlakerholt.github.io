name: Verify fermentation simulator

on:
  push:
    branches: [main]
    paths:
      - 'apps/fermentation-simulator/**'
      - .github/workflows/generate-vessel-source-pdfs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Historical record hashes and gzip payloads use the authoring runtime exactly.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Check the simulator and reviewed source sheets
        working-directory: apps/fermentation-simulator
        shell: bash
        run: |
          set -euo pipefail
          for test in sources/test-*.cjs; do
            node "$test" --public
          done
          node sources/build-app.cjs
          git diff --exit-code -- app.payload.* vessel-catalog.payload
